<!DOCTYPE html>
<html>
<head>

    <title>Register - My Fortunes Bakery</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>🧁 My Fortunes Bakery</h1>

        <p class="auth-subtitle">
            Freshly Baked Happiness Every Day
        </p>

        <h2>Register</h2>

        <form method="POST">

            <label>Nama Lengkap</label>

            <input
                type="text"
                name="nama"
                placeholder="Masukkan nama lengkap"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Masukkan email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Masukkan password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p class="auth-link">
            Sudah punya akun?
            <a href="/login">
                Login di sini
            </a>
        </p>

    </div>

</div>

</body>
</html>
