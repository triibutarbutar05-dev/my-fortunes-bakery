<!DOCTYPE html>
<html>
<head>

    <title>Login - My Fortunes Bakery</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="flash-message {{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}

<div class="auth-container">

    <div class="auth-card">

        <h1>🧁 My Fortunes Bakery</h1>

        <p class="auth-subtitle">
            Freshly Baked Happiness Every Day
        </p>

        <h2>Login</h2>

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Masukkan email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Masukkan password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="auth-link">
            Belum punya akun?
            <a href="/register">
                Daftar sekarang
            </a>
        </p>

    </div>

</div>

</body>
</html>
