<!DOCTYPE html>
<html>
<head>
    <title>Tambah Produk</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

{% include 'navbar.html' %}

<div class="add-product-container">

    <h1>🧁 Tambah Produk Bakery</h1>

    <p class="add-product-subtitle">
        Tambahkan produk baru ke katalog My Fortunes Bakery
    </p>

    <div class="add-product-card">

        <form method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label>Nama Produk</label>

                <input type="text"
                       name="nama_produk"
                       placeholder="Masukkan nama produk"
                       required>
            </div>

            <div class="form-group">
                <label>Kategori</label>

                <select name="category_id">

                    {% for kategori in categories %}

                    <option value="{{ kategori[0] }}">
                        {{ kategori[1] }}
                    </option>

                    {% endfor %}

                </select>
            </div>

            <div class="form-group">
                <label>Harga</label>

                <input type="number"
                       name="harga"
                       placeholder="Masukkan harga produk"
                       required>
            </div>

            <div class="form-group">
                <label>Stok</label>

                <input type="number"
                       name="stok"
                       placeholder="Masukkan jumlah stok"
                       required>
            </div>

            <div class="form-group">
                <label>Deskripsi</label>

                <textarea name="deskripsi"
                          rows="5"
                          placeholder="Tuliskan deskripsi produk"></textarea>
            </div>

            <div class="form-group">
                <label>Upload Gambar Produk</label>

                <input type="file" name="gambar">
            </div>

            <button type="submit" class="save-product-btn">
                Simpan Produk
            </button>

        </form>

    </div>

</div>

</body>
</html>
